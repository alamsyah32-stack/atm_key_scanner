<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATM Barcode Live Scanner</title>
<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#fff;font-family:Arial,sans-serif;min-height:100vh;padding:16px}
.card{max-width:460px;margin:0 auto;background:#1e293b;border-radius:20px;padding:18px;box-shadow:0 20px 50px #0006}
h1{font-size:20px;margin:0 0 6px}.sub{font-size:12px;color:#cbd5e1;margin-bottom:14px}
video{width:100%;aspect-ratio:3/4;object-fit:cover;background:#000;border-radius:16px;border:2px solid #334155}
.status{margin-top:12px;padding:12px;border-radius:12px;background:#334155;font-size:13px}.ok{background:#065f46}.err{background:#7f1d1d}
button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:700;font-size:14px}
small{display:block;color:#94a3b8;margin-top:10px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
<h1>Scanner Barcode ATM</h1>
<div class="sub">Arahkan barcode ke kamera. Hasil scan dikirim otomatis ke aplikasi utama.</div>
<video id="video" playsinline muted></video>
<div id="status" class="status">Menyiapkan kamera...</div>
<button id="closeBtn" type="button">Tutup Scanner</button>
<small>Scanner menggunakan ZXing dan berjalan pada HTTPS GitHub Pages.</small>
</div>
<script>
let reader=null, controls=null, busy=false;
const video=document.getElementById('video');
const statusEl=document.getElementById('status');
function status(msg,cls=''){statusEl.className='status '+cls;statusEl.textContent=msg;}
function sendToApp(code){
  if(!window.opener || window.opener.closed){status('Aplikasi utama tidak ditemukan. Buka scanner dari tombol Buka Kamera di aplikasi.','err');return;}
  // Origin aplikasi utama adalah Apps Script dan berbeda dari origin GitHub Pages,
  // jadi pesan dikirim ke opener dengan targetOrigin '*'. Aplikasi utama tetap
  // memvalidasi event.origin agar hanya scanner GitHub Pages yang diterima.
  window.opener.postMessage({type:'ATM_BARCODE_SCANNED',code:String(code).trim()},'*');
}
async function start(){
  try{
    if(!window.ZXingBrowser) throw new Error('Library ZXing belum termuat.');
    reader=new ZXingBrowser.BrowserMultiFormatReader();
    status('Meminta izin kamera...');
    controls=await reader.decodeFromConstraints(
      {video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false},
      video,
      (result,err)=>{
        if(result && !busy){
          busy=true;
          const code=result.getText ? result.getText() : String(result.text||'');
          if(code){
            status('Barcode terbaca: '+code,'ok');
            sendToApp(code);
            // Beri waktu aplikasi utama memproses, lalu lanjut scan.
            setTimeout(()=>{busy=false;status('Kamera aktif. Arahkan barcode berikutnya.');},1400);
          }else busy=false;
        }
      }
    );
    status('Kamera aktif. Arahkan barcode ke kotak kamera.');
  }catch(e){
    console.error(e);
    status('Gagal membuka kamera: '+(e.message||e),'err');
  }
}
function stop(){
  try{if(controls && controls.stop) controls.stop();}catch(e){}
  controls=null;
  try{if(reader && reader.reset) reader.reset();}catch(e){}
  try{if(video.srcObject){video.srcObject.getTracks().forEach(t=>t.stop());video.srcObject=null;}}catch(e){}
  status('Scanner ditutup.');
}
window.addEventListener('message',e=>{
  if(e.source !== window.opener) return;
  if(e.data && e.data.type==='STOP_ATM_SCANNER') stop();
});
document.getElementById('closeBtn').onclick=()=>{stop();window.close();};
window.addEventListener('beforeunload',stop);
start();
</script>
</body>
</html>
